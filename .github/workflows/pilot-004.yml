name: PILOT-004 one-shot

on:
  push:
    branches:
      - agent/pilot-004-cross-domain

permissions:
  contents: read

jobs:
  experiment:
    if: contains(github.event.head_commit.message, 'Run PILOT-004 experiment')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.13.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy zstandard
      - name: Run PILOT-004
        run: python experiments/pilot-004/run.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: pilot-004-results
          path: experiments/pilot-004/output/
          if-no-files-found: error
