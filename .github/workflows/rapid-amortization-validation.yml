name: RAPID amortization validation

on:
  push:
    branches:
      - agent/rf-replay-roadmap-sync

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Project tests
        run: python -m pytest -q tests
      - name: RAPID amortization targeted tests
        run: python -m pytest -q tests/test_net_rapid_amortization.py
      - name: Print amortization sweep
        run: |
          python - <<'PY'
          import runpy
          ns = runpy.run_path('tests/test_net_rapid_amortization.py')
          from pollicino.net.rapid_amortization import sweep_rapid_amortization
          from pollicino.net.rapid_control_wire import RapidNodeReferenceMode
          for mode in (RapidNodeReferenceMode.FULL_PSEUDONYM_128, RapidNodeReferenceMode.SHARED_U16_INDEX):
              model = ns['_checkpoint_model'](mode)
              sweep = sweep_rapid_amortization(model, (1,2,5,10,20))
              print(mode.value)
              print('shared=', model.shared_control_wire_bytes, 'per_bundle_control=', model.per_bundle_control_wire_bytes)
              for p in sweep.points:
                  print(p.bundle_count, p.baseline_total_wire_bytes, p.rapid_modeled_total_wire_bytes, p.delta_vs_baseline_bytes, p.shared_control_wire_bytes_per_bundle)
          PY
