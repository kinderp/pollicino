name: Governed node reference mule validation

on:
  push:
    branches:
      - agent/rf-replay-roadmap-sync

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Project tests
        run: python -m pytest -q tests
      - name: Governed node mule tests
        run: python -m pytest -q tests/test_node_governed_reference_mule.py tests/test_node_reference_mule_vertical_slice.py
