name: HW-002T loop-delay A-B validation

on:
  push:
    branches:
      - agent/hw-002t-loop-delay-ab
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.13.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,research]' zstandard pyserial platformio
      - name: Run project suite
        run: pytest -q tests
      - name: Validate HW-002 host tools
        run: |
          python -m py_compile hardware/lilygo-lora32-v1.6.1/host/hw002.py
          python -m py_compile hardware/lilygo-lora32-v1.6.1/host/hw002_failures.py
          python -m py_compile hardware/lilygo-lora32-v1.6.1/host/hw002_timing.py
          python hardware/lilygo-lora32-v1.6.1/host/hw002.py selftest
          python hardware/lilygo-lora32-v1.6.1/host/hw002_failures.py --selftest
          python hardware/lilygo-lora32-v1.6.1/host/hw002_timing.py selftest
      - name: Build LILYGO firmware
        run: platformio run -d hardware/lilygo-lora32-v1.6.1
