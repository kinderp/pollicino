name: Minisketch wire budget validation

on:
  push:
    branches:
      - agent/rf-replay-roadmap-sync

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Project tests
        run: python -m pytest -q tests
      - name: Minisketch wire-budget tests
        run: python -m pytest -q tests/test_net_minisketch_wire_budget.py
      - name: Print discriminating break-even
        run: |
          python - <<'PY'
          import runpy
          ns = runpy.run_path('tests/test_net_minisketch_wire_budget.py')
          from pollicino.net.availability_wire_benchmark import benchmark_availability_wire
          from pollicino.net.minisketch_wire_budget import find_minisketch_capacity_break_even
          left = ns['_left_partial_cache']()
          profile = ns['_profile']()
          absolute = benchmark_availability_wire(left, profile=profile).best
          report = find_minisketch_capacity_break_even(
              absolute_wire_bytes=absolute.total_wire_bytes,
              request_count=10,
              profile=profile,
          )
          print('absolute_id=', absolute.representation_id)
          print('absolute_source=', absolute.source_bytes)
          print('absolute_wire=', absolute.total_wire_bytes)
          print('largest_cheaper_capacity=', report.largest_cheaper_capacity)
          print('largest_cheaper_raw=', report.largest_cheaper.raw_sketch_bytes if report.largest_cheaper else None)
          print('largest_cheaper_wire=', report.largest_cheaper.total_wire_bytes if report.largest_cheaper else None)
          print('first_not_cheaper_capacity=', report.first_not_cheaper_capacity)
          print('first_not_cheaper_raw=', report.first_not_cheaper.raw_sketch_bytes if report.first_not_cheaper else None)
          print('first_not_cheaper_wire=', report.first_not_cheaper.total_wire_bytes if report.first_not_cheaper else None)
          PY
