name: Minisketch wire budget validation

on:
  push:
    branches:
      - agent/rf-replay-roadmap-sync

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Project tests
        run: python -m pytest -q tests
      - name: Minisketch wire-budget tests
        run: python -m pytest -q tests/test_net_minisketch_wire_budget.py tests/test_net_minisketch_incremental_budget.py
      - name: Print discriminating break-even and extension budget
        run: |
          python - <<'PY'
          import runpy
          ns = runpy.run_path('tests/test_net_minisketch_wire_budget.py')
          inc = runpy.run_path('tests/test_net_minisketch_incremental_budget.py')
          from pollicino.net.availability_wire_benchmark import benchmark_availability_wire
          from pollicino.net.minisketch_wire_budget import find_minisketch_capacity_break_even
          from pollicino.net.minisketch_incremental_budget import largest_safe_incremental_prefix

          left = ns['_left_partial_cache']()
          profile = ns['_profile']()
          absolute = benchmark_availability_wire(left, profile=profile).best
          report = find_minisketch_capacity_break_even(
              absolute_wire_bytes=absolute.total_wire_bytes,
              request_count=10,
              profile=profile,
          )
          print('absolute_id=', absolute.representation_id)
          print('absolute_source=', absolute.source_bytes)
          print('absolute_wire=', absolute.total_wire_bytes)
          print('largest_cheaper_capacity=', report.largest_cheaper_capacity)
          print('largest_cheaper_raw=', report.largest_cheaper.raw_sketch_bytes if report.largest_cheaper else None)
          print('largest_cheaper_wire=', report.largest_cheaper.total_wire_bytes if report.largest_cheaper else None)
          print('first_not_cheaper_capacity=', report.first_not_cheaper_capacity)
          print('first_not_cheaper_raw=', report.first_not_cheaper.raw_sketch_bytes if report.first_not_cheaper else None)
          print('first_not_cheaper_wire=', report.first_not_cheaper.total_wire_bytes if report.first_not_cheaper else None)

          capacities = inc['CAPACITIES']
          known = largest_safe_incremental_prefix(
              capacities,
              conservative_request_per_capacity=False,
              fixed_request_count=10,
              absolute_wire_bytes=absolute.total_wire_bytes,
              profile=profile,
          )
          worst = largest_safe_incremental_prefix(
              capacities,
              conservative_request_per_capacity=True,
              fixed_request_count=0,
              absolute_wire_bytes=absolute.total_wire_bytes,
              profile=profile,
          )
          print('known_request_safe_capacity=', known.steps[-1].serialized_capacity if known else None)
          print('known_request_total=', known.cumulative_total_wire_bytes if known else None)
          print('worst_split_safe_capacity=', worst.steps[-1].serialized_capacity if worst else None)
          print('worst_split_request_reserve=', worst.request_count_reserve if worst else None)
          print('worst_split_total=', worst.cumulative_total_wire_bytes if worst else None)
          PY
