name: RAPID replica control validation

on:
  push:
    branches:
      - agent/rf-replay-roadmap-sync
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Project tests
        run: python -m pytest -q tests
      - name: RAPID control targeted tests
        run: >-
          python -m pytest -q
          tests/test_net_rapid_deadline_utility.py
          tests/test_net_rapid_meeting_control.py
          tests/test_net_rapid_replica_control.py
