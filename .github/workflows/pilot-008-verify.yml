name: PILOT-008 routing verify

on:
  push:
    branches:
      - agent/pilot-008-cost-aware-routing

permissions:
  contents: read

jobs:
  verify:
    if: contains(github.event.head_commit.message, 'Verify PILOT-008 routing fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Verify deterministic compression core
        run: PYTHONPATH=src pytest -q tests/test_routing.py tests/test_classical_experts.py tests/test_cheap_gate.py tests/test_gating.py tests/test_adaptive.py tests/test_range.py tests/test_codec.py
