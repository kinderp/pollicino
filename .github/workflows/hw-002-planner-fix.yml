name: HW-002 planner estimate validation

on:
  push:
    branches:
      - agent/hw-002-mirrored-batch-planner-fix
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  planner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.13.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,research]' zstandard pyserial
      - name: Run root suite
        run: pytest -q tests
      - name: Validate HW-002 host runner
        run: |
          python -m py_compile hardware/lilygo-lora32-v1.6.1/host/hw002.py
          python hardware/lilygo-lora32-v1.6.1/host/hw002.py selftest
