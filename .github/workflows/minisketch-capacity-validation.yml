name: Minisketch capacity validation

on:
  push:
    branches:
      - agent/rf-replay-roadmap-sync

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Project tests without optional native dependency
        run: python -m pytest -q tests
      - name: Build pinned upstream libminisketch
        run: |
          git clone https://github.com/bitcoin-core/minisketch.git /tmp/minisketch
          git -C /tmp/minisketch checkout 4a179c61e3cbe3ac2b3c027764ce8eb5183155e1
          cmake -S /tmp/minisketch -B /tmp/minisketch-build \
            -DBUILD_SHARED_LIBS=ON \
            -DMINISKETCH_BUILD_TESTS=OFF \
            -DMINISKETCH_BUILD_BENCHMARK=OFF \
            -DMINISKETCH_FIELDS=16
          cmake --build /tmp/minisketch-build --parallel 2
          test -f /tmp/minisketch-build/lib/libminisketch.so
          echo "POLLICINO_MINISKETCH_LIB=/tmp/minisketch-build/lib/libminisketch.so" >> "$GITHUB_ENV"
      - name: Capacity policy tests
        run: python -m pytest -q tests/test_net_minisketch_capacity_host.py
      - name: Print capacity table
        run: |
          python - <<'PY'
          from pollicino.net.minisketch_capacity_host import (
              compute_host_minisketch_capacity,
              compute_host_minisketch_max_elements,
              modeled_raw_sketch_bytes,
          )
          print('max_elements,fpbits,capacity,raw_bytes,inverse_max')
          for max_elements in (8, 16, 20, 32):
              for fpbits in (0, 16, 32, 64):
                  capacity = compute_host_minisketch_capacity(max_elements, fpbits=fpbits)
                  inverse = compute_host_minisketch_max_elements(capacity, fpbits=fpbits)
                  print(max_elements, fpbits, capacity,
                        modeled_raw_sketch_bytes(capacity), inverse, sep=',')
          PY
