name: Store-forward validation

on:
  push:
    branches:
      - agent/rf-replay-roadmap-sync
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Project tests
        run: python -m pytest -q tests
      - name: Store-forward targeted tests
        run: python -m pytest -q tests/test_net_store_forward.py
      - name: Intermittent durable relay smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile
          from pollicino.net import (
              DirectoryPollicinoStore,
              ForwardPeer,
              ScarceLinkProfile,
              forward_contact,
              seed_forwarding_object,
          )

          data = (b"store-forward-intermittent-" * 30)[:384]
          profile = ScarceLinkProfile(
              max_frame_bytes=64,
              bitrate_bps=5000,
              ack_bytes=8,
              max_retries=3,
              seed=31,
          )
          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              origin_root = root / "origin"
              relay_root = root / "relay"
              destination_root = root / "destination"

              origin = ForwardPeer("origin", DirectoryPollicinoStore(origin_root))
              relay = ForwardPeer("relay", DirectoryPollicinoStore(relay_root))
              manifest = seed_forwarding_object(data, chunk_size=64, store=origin.store)

              _, first = forward_contact(
                  manifest,
                  source=origin,
                  target=relay,
                  profile=profile,
                  transfer_id_base=100,
                  max_chunks=3,
              )
              assert first.transferred_chunk_indices == (0, 1, 2)

              # Recreate relay and destination as a later disconnected encounter.
              relay = ForwardPeer("relay", DirectoryPollicinoStore(relay_root))
              destination = ForwardPeer(
                  "destination", DirectoryPollicinoStore(destination_root)
              )
              partial, second = forward_contact(
                  manifest,
                  source=relay,
                  target=destination,
                  profile=profile,
                  transfer_id_base=200,
                  max_chunks=10,
              )
              assert partial is None
              assert second.transferred_chunk_indices == (0, 1, 2)

              origin = ForwardPeer("origin", DirectoryPollicinoStore(origin_root))
              relay = ForwardPeer("relay", DirectoryPollicinoStore(relay_root))
              _, third = forward_contact(
                  manifest,
                  source=origin,
                  target=relay,
                  profile=profile,
                  transfer_id_base=300,
                  max_chunks=10,
              )
              assert third.transferred_chunk_indices == (3, 4, 5)

              relay = ForwardPeer("relay", DirectoryPollicinoStore(relay_root))
              destination = ForwardPeer(
                  "destination", DirectoryPollicinoStore(destination_root)
              )
              reconstructed, fourth = forward_contact(
                  manifest,
                  source=relay,
                  target=destination,
                  profile=profile,
                  transfer_id_base=400,
                  max_chunks=10,
              )
              assert reconstructed == data
              assert fourth.transferred_chunk_indices == (3, 4, 5)
              assert fourth.target_exact
              print({
                  "first": first.transferred_chunk_indices,
                  "second": second.transferred_chunk_indices,
                  "third": third.transferred_chunk_indices,
                  "fourth": fourth.transferred_chunk_indices,
                  "exact": reconstructed == data,
              })
          PY
