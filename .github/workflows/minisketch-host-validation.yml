name: Minisketch host validation

on:
  push:
    branches:
      - agent/rf-replay-roadmap-sync

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Project tests without optional native dependency
        run: python -m pytest -q tests
      - name: Build pinned upstream libminisketch
        run: |
          git clone https://github.com/bitcoin-core/minisketch.git /tmp/minisketch
          git -C /tmp/minisketch checkout 4a179c61e3cbe3ac2b3c027764ce8eb5183155e1
          cmake -S /tmp/minisketch -B /tmp/minisketch-build \
            -DBUILD_SHARED_LIBS=ON \
            -DMINISKETCH_BUILD_TESTS=OFF \
            -DMINISKETCH_BUILD_BENCHMARK=OFF \
            -DMINISKETCH_FIELDS=16
          cmake --build /tmp/minisketch-build --parallel 2
          test -f /tmp/minisketch-build/lib/libminisketch.so
          echo "POLLICINO_MINISKETCH_LIB=/tmp/minisketch-build/lib/libminisketch.so" >> "$GITHUB_ENV"
      - name: Native minisketch adapter tests
        run: python -m pytest -q tests/test_net_minisketch_host.py
      - name: Print native reconciliation checkpoint
        run: |
          python - <<'PY'
          import runpy
          ns = runpy.run_path('tests/test_net_minisketch_host.py')
          from pollicino.net.availability_wire_benchmark import benchmark_availability_wire
          from pollicino.net.link import transmit_exact
          from pollicino.net.minisketch_host import reconcile_partial_caches_with_minisketch

          left, right, left_only, right_only = ns['_partial_caches']()
          result = reconcile_partial_caches_with_minisketch(left, right, capacity=32)
          profile = ns['_profile']()
          sketch_message = b'PNM2' + bytes(36) + result.serialized_sketch
          request_message = b'PNQ2' + bytes(36) + b''.join(i.to_bytes(2, 'big') for i in result.left_only_indices)
          _, sketch_wire = transmit_exact(sketch_message, transfer_id=900, profile=profile)
          _, request_wire = transmit_exact(request_message, transfer_id=901, profile=profile)
          absolute = benchmark_availability_wire(left, profile=profile)

          print('upstream_commit=', result.upstream_commit)
          print('left_available=', sum(left.has(i) for i in range(left.chunk_count)))
          print('right_available=', sum(right.has(i) for i in range(right.chunk_count)))
          print('decoded_difference=', len(result.symmetric_difference_indices))
          print('left_only=', len(left_only), 'right_only=', len(right_only))
          print('raw_sketch_bytes=', result.serialized_sketch_bytes)
          print('sketch_enveloped_bytes=', len(sketch_message))
          print('request_bytes=', len(request_message))
          print('sketch_pnf1_frames=', sketch_wire.frame_count)
          print('request_pnf1_frames=', request_wire.frame_count)
          print('native_reconciliation_wire=', sketch_wire.total_wire_bytes + request_wire.total_wire_bytes)
          print('absolute_best=', absolute.best.representation_id)
          print('absolute_source_bytes=', absolute.best.source_bytes)
          print('absolute_wire=', absolute.best.total_wire_bytes)
          print('build_left_ns=', result.timings.build_left_ns)
          print('build_right_ns=', result.timings.build_right_ns)
          print('serialize_left_ns=', result.timings.serialize_left_ns)
          print('merge_decode_ns=', result.timings.merge_decode_ns)
          PY
