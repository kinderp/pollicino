name: RAPID EDU validation

on:
  push:
    branches:
      - agent/rf-replay-roadmap-sync

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Project tests
        run: python -m pytest -q tests
      - name: EDU RAPID comparison
        run: python -m pytest -q tests/test_net_edu_deadline_discrimination.py tests/test_net_rapid_schedule.py
