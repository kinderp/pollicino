name: Destination recency validation

on:
  push:
    branches:
      - agent/rf-replay-roadmap-sync

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Project tests
        run: python -m pytest -q tests
      - name: Destination recency targeted tests
        run: python -m pytest -q tests/test_net_destination_recency.py
      - name: Print recency comparison
        run: |
          python - <<'PY'
          import runpy
          ns = runpy.run_path('tests/test_net_destination_recency.py')
          from pollicino.net.destination_recency import (
              DestinationRecencyControlProfile,
              DestinationRecencyNodeReferenceMode,
              account_destination_recency_control,
          )
          print('objects,epidemic,simple_transfer,indexed_control,indexed_delta,full_control,full_delta,quote_entries')
          for count in (1, 2, 5, 10, 20):
              strategy, simple, epidemic = ns['_run'](count)
              idx = account_destination_recency_control(
                  strategy,
                  profile=DestinationRecencyControlProfile(
                      DestinationRecencyNodeReferenceMode.SHARED_U16_INDEX
                  ),
                  node_count=4,
              )
              full = account_destination_recency_control(
                  strategy,
                  profile=DestinationRecencyControlProfile(
                      DestinationRecencyNodeReferenceMode.FULL_PSEUDONYM_128
                  ),
                  node_count=4,
              )
              print(count, epidemic.total_wire_bytes, simple.total_wire_bytes,
                    idx.control_wire_bytes,
                    simple.total_wire_bytes + idx.control_wire_bytes - epidemic.total_wire_bytes,
                    full.control_wire_bytes,
                    simple.total_wire_bytes + full.control_wire_bytes - epidemic.total_wire_bytes,
                    idx.quote_entry_count, sep=',')
          PY
