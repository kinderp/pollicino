name: HW-003 validation

on:
  push:
    branches:
      - agent/hw-003-event-driven-responder
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.13.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,research]' zstandard pyserial platformio
      - name: Run project suite
        run: pytest -q tests
      - name: Validate hardware host tools
        run: |
          python -m py_compile hardware/lilygo-lora32-v1.6.1/host/hw002.py
          python -m py_compile hardware/lilygo-lora32-v1.6.1/host/hw002_timing.py
          python -m py_compile hardware/lilygo-lora32-v1.6.1/host/hw003.py
          python hardware/lilygo-lora32-v1.6.1/host/hw002.py selftest
          python hardware/lilygo-lora32-v1.6.1/host/hw002_timing.py selftest
          python hardware/lilygo-lora32-v1.6.1/host/hw003.py selftest
      - name: Build frozen HW-002T firmware
        run: platformio run -d hardware/lilygo-lora32-v1.6.1 -e lilygo_lora32_v161_sx1276
      - name: Build HW-003 event-driven firmware
        run: platformio run -d hardware/lilygo-lora32-v1.6.1 -e lilygo_lora32_v161_sx1276_hw003
