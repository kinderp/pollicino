name: PX20 cross-platform persistence

on:
  workflow_dispatch:
  push:
    branches:
      - pollicino/px20-pn-d2rp-cross-platform-persistence

jobs:
  persistence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Focused persistence suite
        run: >-
          python -m pytest
          tests/test_px20_pn_d2rp_cross_platform_persistence.py
          tests/test_persistent_catalog.py
          tests/test_persistent_query.py
      - name: Native evidence probe
        shell: bash
        run: >-
          python experiments/px20_pn_d2rp_persistence.py probe
          --output px20-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: px20-${{ matrix.os }}
          path: px20-${{ matrix.os }}.json
