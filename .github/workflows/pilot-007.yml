name: PILOT-007 one-shot

on:
  push:
    branches:
      - agent/pilot-007-neural-value

permissions:
  contents: read

jobs:
  experiment:
    if: contains(github.event.head_commit.message, 'Run PILOT-007 experiment')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.13.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy zstandard pytest
      - name: Verify cheap and gated codecs
        run: PYTHONPATH=src pytest -q tests/test_classical_experts.py tests/test_cheap_gate.py tests/test_gating.py tests/test_adaptive.py tests/test_range.py tests/test_codec.py
      - name: Run PILOT-007
        run: python experiments/pilot-007/compat_run.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: pilot-007-results
          path: experiments/pilot-007/output/
          if-no-files-found: error
