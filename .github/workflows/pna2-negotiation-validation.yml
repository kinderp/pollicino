name: PNA2 negotiation validation

on:
  push:
    branches:
      - agent/rf-replay-roadmap-sync

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Project tests
        run: python -m pytest -q tests
      - name: PNA2 negotiation targeted tests
        run: python -m pytest -q tests/test_net_availability_negotiation.py tests/test_net_availability_reconciliation.py tests/test_net_availability_wire_benchmark.py
