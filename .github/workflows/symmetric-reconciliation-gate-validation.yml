name: Symmetric reconciliation gate validation

on:
  push:
    branches:
      - agent/rf-replay-roadmap-sync

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Project tests
        run: python -m pytest -q tests
      - name: Symmetric reconciliation gate tests
        run: python -m pytest -q tests/test_net_symmetric_reconciliation_gate.py
      - name: Print discriminating partial-cache case
        run: |
          python - <<'PY'
          import runpy
          ns = runpy.run_path('tests/test_net_symmetric_reconciliation_gate.py')
          from pollicino.net.symmetric_reconciliation_gate import model_symmetric_partial_cache_gate
          left, right = ns['_near_identical_partial_caches']()
          r = model_symmetric_partial_cache_gate(left, right, sketch_capacity=32)
          print('left_absolute=', r.left_absolute.best_absolute_id, r.left_absolute.best_absolute_bytes)
          print('right_absolute=', r.right_absolute.best_absolute_id, r.right_absolute.best_absolute_bytes)
          print('two_absolute=', r.best_two_absolute_summaries_bytes)
          print('symmetric_difference=', r.symmetric_difference_count)
          print('modeled_sketch=', r.modeled_sketch_bytes)
          print('modeled_request=', r.modeled_one_way_request_bytes)
          print('modeled_one_way_control=', r.modeled_one_way_control_bytes)
          PY
