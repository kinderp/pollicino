name: LILYGO minisketch probe build

on:
  push:
    branches:
      - agent/rf-replay-roadmap-sync

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python helpers
        run: |
          python -m py_compile \
            hardware/lilygo-lora32-v1.6.1/minisketch-probe/prepare.py \
            hardware/lilygo-lora32-v1.6.1/minisketch-probe/capture.py
      - name: Install frozen PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Prepare pinned upstream dependency
        run: python hardware/lilygo-lora32-v1.6.1/minisketch-probe/prepare.py
      - name: Build LILYGO minisketch probe
        run: pio run -d hardware/lilygo-lora32-v1.6.1/minisketch-probe
      - name: Report firmware footprint
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          project = Path('hardware/lilygo-lora32-v1.6.1/minisketch-probe')
          build = project / '.pio/build/lilygo_v161_minisketch_probe'
          elf = build / 'firmware.elf'
          binary = build / 'firmware.bin'
          tool = Path.home() / '.platformio/packages/toolchain-xtensa-esp32/bin/xtensa-esp32-elf-size'
          assert elf.is_file() and binary.is_file() and tool.is_file()
          out = subprocess.check_output([str(tool), str(elf)], text=True)
          print(out, end='')
          print('firmware_bin_bytes=', binary.stat().st_size)
          pin = project / 'lib/minisketch/UPSTREAM_PIN.txt'
          print(pin.read_text(), end='')
          assert '4a179c61e3cbe3ac2b3c027764ce8eb5183155e1' in pin.read_text()
          PY
