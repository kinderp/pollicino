name: RAPID encounter tests
on:
  push:
    branches: [agent/rf-replay-roadmap-sync]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_net_rapid_encounter.py tests/test_net_rapid_selection.py tests/test_net_rapid_inference.py
