name: PN-003 opaque coordinate resolver

on:
  push:
    branches:
      - agent/pn-003-coordinate-resolver
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pn003:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.13.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,research]' zstandard
      - name: Test scientific/root suite
        run: pytest -q tests
      - name: Run PN-003
        run: python experiments/pn-003/run.py
      - name: Upload PN-003 results
        uses: actions/upload-artifact@v4
        with:
          name: pn-003-results
          path: experiments/pn-003/results.json
          if-no-files-found: error
