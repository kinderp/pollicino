name: PILOT-011 publish one-shot

on:
  push:
    branches:
      - agent/pilot-011-regret-bit-credit

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: contains(github.event.head_commit.message, 'Publish PILOT-011 results')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download successful experiment artifact
        uses: actions/download-artifact@v4
        with:
          name: pilot-011-results
          path: /tmp/pilot011
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: kinderp/pollicino
          run-id: 31964824563
      - name: Publish frozen result tables
        run: |
          set -euo pipefail
          cp /tmp/pilot011/results.json experiments/pilot-011/results.json
          cp /tmp/pilot011/candidate-policies.csv experiments/pilot-011/candidate-policies.csv
          cp /tmp/pilot011/pareto.csv experiments/pilot-011/pareto.csv
          cp /tmp/pilot011/development-routes.csv experiments/pilot-011/development-routes.csv
          cp /tmp/pilot011/holdout.csv experiments/pilot-011/holdout.csv
          cp /tmp/pilot011/controls.csv experiments/pilot-011/controls.csv
          cp /tmp/pilot011/holdout-manifest.json experiments/pilot-011/holdout-manifest.json
          git config user.name 'Antonio'
          git config user.email 'a.caristia@gmail.com'
          git add experiments/pilot-011/results.json experiments/pilot-011/candidate-policies.csv experiments/pilot-011/pareto.csv experiments/pilot-011/development-routes.csv experiments/pilot-011/holdout.csv experiments/pilot-011/controls.csv experiments/pilot-011/holdout-manifest.json
          git commit -m 'Record PILOT-011 results'
          git push
