name: PILOT-003 one-shot

on:
  push:
    branches:
      - agent/pilot-003-crossing-line

permissions:
  contents: read

jobs:
  experiment:
    if: contains(github.event.head_commit.message, 'Run PILOT-003 experiment')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy zstandard
      - name: Run PILOT-003
        run: python experiments/pilot-003/run.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: pilot-003-results
          path: experiments/pilot-003/output/
          if-no-files-found: error
