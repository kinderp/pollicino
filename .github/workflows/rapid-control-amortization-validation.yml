name: RAPID control amortization validation

on:
  push:
    branches:
      - agent/rf-replay-roadmap-sync

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Project tests
        run: python -m pytest -q tests
      - name: Multi-object amortization test
        run: python -m pytest -q tests/test_net_rapid_control_amortization.py
      - name: Print amortization sweep
        run: |
          python - <<'PY'
          import runpy
          ns = runpy.run_path('tests/test_net_rapid_control_amortization.py')
          from pollicino.net.rapid_break_even import compare_rapid_wire_cost
          from pollicino.net.rapid_control_wire import (
              RapidControlWireProfile, RapidNodeReferenceMode,
              account_rapid_control_wire,
          )
          from pollicino.net.rapid_shared_quote_accounting import (
              account_shared_opportunity_quotes,
              rapid_modeled_total_with_shared_opportunity_quotes,
          )
          print('objects,epidemic,rapid_transfer,indexed_control,indexed_delta,queue_entries,shared_control,shared_delta,shared_queue_entries')
          for count in (1, 2, 5, 10, 20):
              rapid, epidemic = ns['_run'](count)
              profile = RapidControlWireProfile(RapidNodeReferenceMode.SHARED_U16_INDEX)
              idx_c = account_rapid_control_wire(
                  rapid,
                  profile=profile,
                  node_count=4,
              )
              idx = compare_rapid_wire_cost(rapid, baseline=epidemic, control=idx_c)
              shared = account_shared_opportunity_quotes(
                  rapid,
                  profile=profile,
                  node_count=4,
              )
              shared_total = rapid_modeled_total_with_shared_opportunity_quotes(
                  rapid,
                  control=shared,
              )
              print(count, epidemic.total_wire_bytes,
                    rapid.total_wire_bytes_excluding_rapid_control,
                    idx_c.control_wire_bytes, idx.delta_vs_baseline_bytes,
                    idx_c.queue_quote_entry_count,
                    shared.modeled_control_wire_bytes,
                    shared_total - epidemic.total_wire_bytes,
                    shared.shared_queue_quote_entry_count, sep=',')
          PY
