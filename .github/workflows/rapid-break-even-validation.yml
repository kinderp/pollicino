name: RAPID break-even validation

on:
  push:
    branches:
      - agent/rf-replay-roadmap-sync

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Project tests
        run: python -m pytest -q tests
      - name: Break-even targeted test
        run: python -m pytest -q tests/test_net_rapid_break_even.py
      - name: Print break-even sweep
        run: |
          python - <<'PY'
          import runpy
          ns = runpy.run_path('tests/test_net_rapid_break_even.py')
          from pollicino.net.rapid_break_even import compare_rapid_wire_cost
          from pollicino.net.rapid_control_wire import (
              RapidControlWireProfile, RapidNodeReferenceMode,
              account_rapid_control_wire,
          )
          print('size,epidemic,rapid_transfer,full_control,full_delta,indexed_control,indexed_delta')
          for size in (16, 32, 64, 128, 256):
              rapid, epidemic = ns['_run'](size)
              full_c = account_rapid_control_wire(
                  rapid,
                  profile=RapidControlWireProfile(RapidNodeReferenceMode.FULL_PSEUDONYM_128),
                  node_count=4,
              )
              idx_c = account_rapid_control_wire(
                  rapid,
                  profile=RapidControlWireProfile(RapidNodeReferenceMode.SHARED_U16_INDEX),
                  node_count=4,
              )
              full = compare_rapid_wire_cost(rapid, baseline=epidemic, control=full_c)
              idx = compare_rapid_wire_cost(rapid, baseline=epidemic, control=idx_c)
              print(size, epidemic.total_wire_bytes, rapid.total_wire_bytes_excluding_rapid_control,
                    full_c.control_wire_bytes, full.delta_vs_baseline_bytes,
                    idx_c.control_wire_bytes, idx.delta_vs_baseline_bytes, sep=',')
          PY
