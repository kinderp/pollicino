name: HW-002 failure analysis validation

on:
  push:
    branches:
      - agent/hw-002-reliability-42b
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  failure-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile host analyzers
        run: |
          python -m py_compile hardware/lilygo-lora32-v1.6.1/host/hw002.py
          python -m py_compile hardware/lilygo-lora32-v1.6.1/host/hw002_failures.py
      - name: Run HW-002 host self-tests
        run: |
          python hardware/lilygo-lora32-v1.6.1/host/hw002.py selftest
          python hardware/lilygo-lora32-v1.6.1/host/hw002_failures.py --selftest
