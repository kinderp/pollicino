name: PNA2 codec validation

on:
  push:
    branches:
      - agent/rf-replay-roadmap-sync

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Project tests
        run: python -m pytest -q tests
      - name: PNA2 codec targeted tests
        run: python -m pytest -q tests/test_net_availability_reconciliation.py
      - name: Print max-chunk codec regimes
        run: |
          python - <<'PY'
          import hashlib, math
          from pollicino.net.availability_reconciliation import (
              AvailabilityResearchCodec,
              availability_codec_candidates,
          )
          from pollicino.net.store import AvailabilitySummary, MAX_CHUNKS

          def summary(chunk_count, available):
              bits = bytearray(math.ceil(chunk_count / 8))
              for index in available:
                  byte, bit = divmod(index, 8)
                  bits[byte] |= 1 << bit
              return AvailabilitySummary(
                  manifest_fingerprint=hashlib.sha256(b'pna2-sweep').digest(),
                  chunk_count=chunk_count,
                  available_bits=bytes(bits),
              )

          n = MAX_CHUNKS
          print('missing,pna1,missing_u16,missing_ranges,available_u16,available_ranges,zlib,best')
          for missing_count in (0, 1, 5, 20, 100, 1000, 4095, 4096, 10000, 32768, 65535):
              missing = set(range(missing_count))
              s = summary(n, (i for i in range(n) if i not in missing))
              sizes = {c.codec: c.encoded_bytes for c in availability_codec_candidates(s)}
              best = min(sizes, key=lambda codec: (sizes[codec], int(codec)))
              print(missing_count, len(s.encode()),
                    sizes[AvailabilityResearchCodec.MISSING_U16],
                    sizes[AvailabilityResearchCodec.MISSING_RANGES_U16],
                    sizes[AvailabilityResearchCodec.AVAILABLE_U16],
                    sizes[AvailabilityResearchCodec.AVAILABLE_RANGES_U16],
                    sizes[AvailabilityResearchCodec.BITMAP_ZLIB],
                    best.name, sep=',')
          PY
