name: HW-002 measurement ping validation

on:
  push:
    branches:
      - agent/hw-002-measurement-ping
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  hw002:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pollicino scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.13.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,research]' zstandard pyserial

      - name: Run root/scientific suite
        run: pytest -q tests

      - name: Check host scripts
        run: |
          python -m py_compile hardware/lilygo-lora32-v1.6.1/host/bridge.py
          python -m py_compile hardware/lilygo-lora32-v1.6.1/host/hw002.py
          python hardware/lilygo-lora32-v1.6.1/host/bridge.py selftest
          python hardware/lilygo-lora32-v1.6.1/host/hw002.py selftest

      - name: Install frozen PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Compile HW-002 firmware
        run: pio run -d hardware/lilygo-lora32-v1.6.1
