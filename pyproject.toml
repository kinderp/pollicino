[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pollicino"
version = "0.0.0"
description = "Research and teaching platform for learned lossless compression and generative file identification"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
research = ["numpy", "pyyaml"]
pytorch = ["torch"]
mlx = ["mlx"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
